<svg xmlns="http://www.w3.org/2000/svg" width="430" height="210" viewBox="0 0 430 210" role="img" aria-labelledby="title desc">
  <title id="title">Delivery scope</title>
  <desc id="desc">A delivery path from architecture through build and validation to a working system.</desc>
  <rect x="0.5" y="0.5" width="429" height="209" rx="18" fill="#F7F4EC" stroke="#CCD8CF"/>
  <rect x="24" y="24" width="4" height="18" rx="2" fill="#25854D"/>
  <text x="40" y="38" fill="#176B3A" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">DELIVERY SCOPE</text>
  <rect x="318" y="20" width="88" height="25" rx="12.5" fill="#EBF2EC" stroke="#BDCEC1"/>
  <text x="362" y="36" text-anchor="middle" fill="#496053" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">PROOF-FIRST</text>
  <text x="24" y="78" fill="#17201B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Goal → working system</text>
  <text x="24" y="101" fill="#5F6B64" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">End-to-end ownership with inspectable evidence</text>
  <line x1="48" y1="139" x2="382" y2="139" stroke="#BDCEC1" stroke-width="2"/>
  <circle cx="48" cy="139" r="8" fill="#25854D"/>
  <circle cx="159" cy="139" r="8" fill="#25854D"/>
  <circle cx="270" cy="139" r="8" fill="#25854D"/>
  <circle cx="382" cy="139" r="8" fill="#25854D"/>
  <text x="48" y="169" text-anchor="middle" fill="#26352C" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.6">ARCHITECTURE</text>
  <text x="159" y="169" text-anchor="middle" fill="#26352C" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.6">BUILD</text>
  <text x="270" y="169" text-anchor="middle" fill="#26352C" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.6">VALIDATE</text>
  <text x="382" y="169" text-anchor="middle" fill="#26352C" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.6">DELIVER</text>
  <text x="215" y="192" text-anchor="middle" fill="#5F6B64" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11">Clear boundaries · reversible delivery</text>
