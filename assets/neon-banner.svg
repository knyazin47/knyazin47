<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Sergey Kiman — AI Product Engineer</title>
  <desc id="desc">Неоновый баннер для GitHub-профиля</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b18"/>
      <stop offset="54%" stop-color="#11112b"/>
      <stop offset="100%" stop-color="#191036"/>
    </linearGradient>
    <linearGradient id="neonLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="52%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ff4ecd"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity=".62"/>
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity=".21"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#b8c6ff" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="28" fill="url(#background)"/>
  <rect width="1280" height="320" rx="28" fill="url(#grid)"/>
  <circle cx="1038" cy="94" r="225" fill="url(#orb)"/>
  <circle cx="1198" cy="255" r="160" fill="#ff4ecd" opacity=".08"/>
  <path d="M735 279 C850 165 958 336 1084 181 C1140 112 1195 106 1260 54" fill="none" stroke="url(#neonLine)" stroke-width="3" opacity=".9" filter="url(#glow)"/>
  <path d="M772 280 C875 208 941 267 1028 201 C1112 137 1174 154 1260 92" fill="none" stroke="#00e5ff" stroke-width="1" opacity=".38"/>
  <g fill="none" stroke="#f6e8ff" stroke-opacity=".48" stroke-width="1">
    <circle cx="1036" cy="92" r="82"/>
    <circle cx="1036" cy="92" r="112"/>
    <path d="M924 92h224M1036 -20v224"/>
  </g>
  <g fill="#00e5ff" filter="url(#glow)">
    <circle cx="935" cy="226" r="5"/>
    <circle cx="1083" cy="183" r="5"/>
    <circle cx="1214" cy="94" r="5"/>
  </g>

  <text x="72" y="84" fill="#00e5ff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="4">BUILD · AUTOMATE · SHIP</text>
  <text x="72" y="148" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" letter-spacing="1">SERGEY KIMAN</text>
  <rect x="72" y="181" width="486" height="3" rx="1.5" fill="url(#neonLine)"/>
  <text x="72" y="222" fill="#d9d7ff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">AI PRODUCT ENGINEER</text>
  <text x="72" y="258" fill="#a8b2d8" font-family="Arial, Helvetica, sans-serif" font-size="18">Automation · Linux tools · Interfaces</text>
  <rect x="72" y="276" width="196" height="28" rx="14" fill="#00e5ff" fill-opacity=".13" stroke="#00e5ff" stroke-opacity=".46"/>
  <text x="91" y="296" fill="#c7f8ff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">LOCAL-FIRST BUILDER</text>
</svg>
